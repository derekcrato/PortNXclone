<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720">
    <title>PortNX Simulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0c0c12; color: #e6edf3; overflow: hidden; width: 1280px; height: 720px; }
        .hidden { display: none !important; }
        
        /* Home Screen */
        .home-screen { position: absolute; top: 0; left: 0; width: 1280px; height: 720px; display: flex; flex-direction: column; align-items: center; }
        .logo { width: 240px; height: 240px; margin-top: 60px; object-fit: contain; }
        .cards-container { display: flex; gap: 30px; justify-content: center; margin-top: 40px; }
        .card { width: 280px; height: 280px; background: #0e0e14; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; position: relative; }
        .card:hover, .card.selected { transform: scale(1.03); box-shadow: 0 0 25px rgba(196,0,0,0.5); }
        .card:nth-child(1):hover, .card:nth-child(1).selected { box-shadow: 0 0 25px rgba(196,0,0,0.5); border: 2px solid #c40000; }
        .card:nth-child(2):hover, .card:nth-child(2).selected { box-shadow: 0 0 25px rgba(20,80,200,0.5); border: 2px solid #1450c8; }
        .card:nth-child(3):hover, .card:nth-child(3).selected { box-shadow: 0 0 25px rgba(0,140,0,0.5); border: 2px solid #008c00; }
        .card-icon { width: 160px; height: 160px; object-fit: contain; margin-bottom: 16px; }
        .card-label { font-size: 20px; font-weight: 500; color: #fff; text-align: center; }
        .card-label.unselected { color: #a0a0af; }
        .hints { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); color: #a0a0af; font-size: 14px; display: flex; gap: 24px; }
        
        /* Browse Screen */
        .browse-screen { position: absolute; top: 0; left: 0; width: 1280px; height: 720px; display: none; flex-direction: column; }
        .topbar { height: 80px; background: #0c0c12; display: flex; align-items: center; padding: 0 40px; justify-content: space-between; border-bottom: 1px solid #1a1a2e; }
        .topbar-title { font-size: 28px; font-weight: 600; color: #fff; }
        .topbar-hint { color: #a0a0af; font-size: 16px; }
        .filter-bar { height: 50px; background: #0e0e14; display: flex; align-items: center; padding: 0 40px; gap: 16px; border-bottom: 1px solid #1a1a2e; }
        .filter-btn { background: #1a1a2e; border: 1px solid #30363d; color: #e6edf3; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .filter-btn:hover, .filter-btn.active { background: #1f6feb; border-color: #1f6feb; }
        .grid { flex: 1; padding: 30px 40px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; overflow-y: auto; }
        .cell { background: #12161e; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: all 0.2s; height: 300px; }
        .cell:hover, .cell.selected { background: #1e3c64; }
        .cell-icon { width: 192px; height: 192px; object-fit: contain; margin-bottom: 12px; }
        .cell-title { font-size: 16px; font-weight: 500; color: #e6edf3; text-align: center; margin-bottom: 6px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cell-meta { font-size: 12px; color: #8b949e; text-align: center; }
        .browse-hints { position: absolute; bottom: 20px; left: 40px; color: #8b949e; font-size: 14px; display: flex; gap: 24px; }
        
        /* Details Screen */
        .details-screen { position: absolute; top: 0; left: 0; width: 1280px; height: 720px; display: none; background: #0c0c12; }
        .details-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0c0c12; z-index: 1; }
        .details-overlay { position: absolute; top: 360px; left: 0; width: 100%; height: calc(100% - 360px); background: rgba(0,0,0,0.75); z-index: 2; }
        .details-poster { position: absolute; top: 80px; right: 80px; width: 420px; height: 240px; object-fit: cover; border-radius: 6px; box-shadow: 0 15px 45px rgba(0,0,0,0.5); z-index: 3; }
        .details-title { position: absolute; top: 380px; left: 40px; font-size: 32px; font-weight: 700; color: #e6edf3; max-width: 800px; z-index: 3; }
        .details-meta { position: absolute; top: 440px; left: 40px; font-size: 16px; color: #8b949e; max-width: 800px; z-index: 3; }
        .details-desc { position: absolute; top: 480px; left: 40px; font-size: 16px; color: #e6edf3; max-width: 800px; line-height: 1.5; z-index: 3; }
        .details-notes { position: absolute; top: 580px; left: 40px; font-size: 14px; color: #8b949e; max-width: 800px; line-height: 1.5; z-index: 3; }
        .details-back-hint { position: absolute; bottom: 20px; left: 30px; font-size: 16px; color: #8b949e; z-index: 3; }
        .details-install-hint { position: absolute; bottom: 20px; right: 40px; font-size: 18px; color: #1f6feb; font-weight: 600; z-index: 3; cursor: pointer; }
        
        /* Loading */
        .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; color: #8b949e; }
        
        /* Toast */
        .toast { position: fixed; top: 20px; right: 40px; background: rgba(32, 165, 48, 0.9); color: #d2ffd7; padding: 12px 20px; border-radius: 10px; font-size: 16px; z-index: 100; display: none; }
        
        /* Pagination */
        .pagination { position: absolute; bottom: 20px; right: 40px; color: #8b949e; font-size: 14px; display: flex; gap: 12px; align-items: center; }
        .page-btn { background: #1a1a2e; border: 1px solid #30363d; color: #e6edf3; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>
    
    <!-- Home Screen -->
    <div class="home-screen" id="homeScreen">
        <img class="logo" src="../icon.jpg" alt="PortNX">
        <div class="cards-container">
            <div class="card selected" data-tab="0" onclick="selectTab(0)">
                <img class="card-icon" src="../download.png" alt="Ports">
                <div class="card-label" id="label0">Ports</div>
            </div>
            <div class="card" data-tab="1" onclick="selectTab(1)">
                <img class="card-icon" src="../queue.png" alt="Queue">
                <div class="card-label unselected" id="label1">Queue</div>
            </div>
            <div class="card" data-tab="2" onclick="selectTab(2)">
                <img class="card-icon" src="../settings.png" alt="Settings">
                <div class="card-label unselected" id="label2">Settings</div>
            </div>
        </div>
        <div class="hints">
            <span>🎮 Navegar</span>
            <span>✅ Abrir</span>
            <span>❌ Sair</span>
        </div>
    </div>
    
    <!-- Browse Screen -->
    <div class="browse-screen" id="browseScreen">
        <div class="topbar">
            <div class="topbar-title" id="browseTitle">Ports</div>
            <div class="topbar-hint">🎮 Voltar</div>
        </div>
        <div class="filter-bar">
            <select class="filter-btn" id="filterGenre">
                <option value="all">Todos os Gêneros</option>
            </select>
            <select class="filter-btn" id="filterPlatform">
                <option value="all">Todas Plataformas</option>
            </select>
            <select class="filter-btn" id="filterSort">
                <option value="recent">Mais Recentes</option>
                <option value="name">Nome (A-Z)</option>
                <option value="rating">Melhor Avaliados</option>
                <option value="size">Menor Tamanho</option>
            </select>
            <select class="filter-btn" id="filterRegion">
                <option value="all">Todas Regiões</option>
                <option value="US">US</option>
                <option value="EU">EU</option>
                <option value="JP">JP</option>
            </select>
        </div>
        <div class="grid" id="grid"></div>
        <div class="loading hidden" id="loading">Carregando...</div>
        <div class="pagination" id="pagination"></div>
        <div class="browse-hints">
            <span>✅ Abrir detalhes</span>
            <span>❌ Voltar</span>
            <span>🔍 Ver</span>
            <span>L/R: Página</span>
        </div>
    </div>
    
    <!-- Details Screen -->
    <div class="details-screen" id="detailsScreen">
        <div class="details-bg"></div>
        <div class="details-overlay"></div>
        <img class="details-poster" id="detailsPoster" alt="Poster">
        <div class="details-title" id="detailsTitle"></div>
        <div class="details-meta" id="detailsMeta"></div>
        <div class="details-desc" id="detailsDesc"></div>
        <div class="details-notes" id="detailsNotes"></div>
        <div class="details-back-hint">❌ Voltar ao menu</div>
        <div class="details-install-hint" id="installBtn">✅ Instalar / Baixar</div>
    </div>

    <script>
        let currentTab = 0;
        let allGames = [];
        let games = [];
        let selectedIndex = 0;
        let currentView = 'home'; // home, browse, details
        let currentPage = 0;
        const GAMES_PER_PAGE = 6;
        
        async function loadGames() {
            try {
                const response = await fetch('../index.json');
                const data = await response.json();
                const titledb = data.titledb || {};
                const gamesList = [];
                for (const [key, v] of Object.entries(titledb)) {
                    gamesList.push({
                        id: v.id || key,
                        name: v.name || '',
                        description: v.description || '',
                        notes: v.notes || '',
                        region: v.region || 'US',
                        publisher: v.publisher || '',
                        releaseDate: v.releaseDate || 0,
                        rating: v.rating || 0,
                        size: v.size || 0,
                        iconUrl: v.iconUrl || '',
                        version: String(v.version || 0),
                        portedFrom: v.portedFrom || '',
                        genre: v.genre || ''
                    });
                }
                allGames = gamesList;
                games = gamesList;
                populateFilters();
                renderGrid();
                renderPagination();
                document.getElementById('loading').classList.add('hidden');
            } catch (e) {
                console.error('Erro ao carregar index.json:', e);
                document.getElementById('loading').textContent = 'Erro ao carregar catálogo';
            }
        }
        
        function formatSize(bytes) {
            if (!bytes) return 'Tamanho desconhecido';
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            let v = bytes, u = 0;
            while (v >= 1024 && u < 4) { v /= 1024; u++; }
            return u === 0 ? `${bytes} B` : `${v.toFixed(1)} ${units[u]}`;
        }
        
        function formatDate(d) {
            if (!d) return '';
            const s = String(d);
            if (s.length !== 8) return s;
            return `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`;
        }
        
        function populateFilters() {
            const genres = new Set();
            const platforms = new Set();
            allGames.forEach(g => {
                if (g.genre) genres.add(g.genre);
                if (g.portedFrom) platforms.add(g.portedFrom);
            });
            
            const genreSelect = document.getElementById('filterGenre');
            const platformSelect = document.getElementById('filterPlatform');
            
            [...genres].sort().forEach(g => {
                const opt = document.createElement('option');
                opt.value = g;
                opt.textContent = g;
                genreSelect.appendChild(opt);
            });
            
            [...platforms].sort().forEach(p => {
                const opt = document.createElement('option');
                opt.value = p;
                opt.textContent = p;
                platformSelect.appendChild(opt);
            });
        }
        
        function applyFilters() {
            const genreFilter = document.getElementById('filterGenre').value;
            const platformFilter = document.getElementById('filterPlatform').value;
            const sortFilter = document.getElementById('filterSort').value;
            const regionFilter = document.getElementById('filterRegion').value;
            
            let filtered = [...allGames];
            
            if (genreFilter !== 'all') {
                filtered = filtered.filter(g => g.genre === genreFilter);
            }
            
            if (platformFilter !== 'all') {
                filtered = filtered.filter(g => g.portedFrom === platformFilter);
            }
            
            if (regionFilter !== 'all') {
                filtered = filtered.filter(g => g.region === regionFilter);
            }
            
            switch (sortFilter) {
                case 'recent':
                    filtered.sort((a, b) => (b.releaseDate || 0) - (a.releaseDate || 0));
                    break;
                case 'name':
                    filtered.sort((a, b) => a.name.localeCompare(b.name));
                    break;
                case 'rating':
                    filtered.sort((a, b) => (b.rating || 0) - (a.rating || 0));
                    break;
                case 'size':
                    filtered.sort((a, b) => (a.size || 0) - (b.size || 0));
                    break;
            }
            
            games = filtered;
            currentPage = 0;
            selectedIndex = 0;
            renderGrid();
            renderPagination();
        }
        
        function renderPagination() {
            const pagination = document.getElementById('pagination');
            const totalPages = Math.ceil(games.length / GAMES_PER_PAGE);
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }
            pagination.innerHTML = '';
            const prevBtn = document.createElement('button');
            prevBtn.className = 'page-btn';
            prevBtn.textContent = '◀ Anterior';
            prevBtn.disabled = currentPage === 0;
            prevBtn.onclick = () => { if (currentPage > 0) { currentPage--; renderGrid(); renderPagination(); } };
            pagination.appendChild(prevBtn);
            
            const pageInfo = document.createElement('span');
            pageInfo.textContent = `${currentPage + 1} / ${totalPages}`;
            pagination.appendChild(pageInfo);
            
            const nextBtn = document.createElement('button');
            nextBtn.className = 'page-btn';
            nextBtn.textContent = 'Próximo ▶';
            nextBtn.disabled = currentPage >= totalPages - 1;
            nextBtn.onclick = () => { if (currentPage < totalPages - 1) { currentPage++; renderGrid(); renderPagination(); } };
            pagination.appendChild(nextBtn);
        }
        
        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            const start = currentPage * GAMES_PER_PAGE;
            const end = Math.min(start + GAMES_PER_PAGE, games.length);
            const pageGames = games.slice(start, end);
            
            pageGames.forEach((game, i) => {
                const globalIndex = start + i;
                const cell = document.createElement('div');
                cell.className = 'cell' + (globalIndex === selectedIndex ? ' selected' : '');
                cell.dataset.index = globalIndex;
                cell.onclick = () => openDetails(globalIndex);
                
                const icon = document.createElement('img');
                icon.className = 'cell-icon';
                icon.src = game.iconUrl || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256"><rect fill="%231a1a2e" width="256" height="256"/></svg>';
                icon.onerror = () => { icon.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256"><rect fill="%231a1a2e" width="256" height="256"/></svg>'; };
                
                const title = document.createElement('div');
                title.className = 'cell-title';
                title.textContent = game.name;
                
                const meta = document.createElement('div');
                meta.className = 'cell-meta';
                meta.textContent = formatSize(game.size) + (game.version ? ` • v${game.version}` : '');
                
                cell.appendChild(icon);
                cell.appendChild(title);
                cell.appendChild(meta);
                grid.appendChild(cell);
            });
            
            if (games.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #8b949e; padding: 40px;">Nenhum jogo encontrado</div>';
            }
            
            document.getElementById('loading').classList.add('hidden');
        }
        
        function selectTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.card').forEach((c, i) => {
                c.classList.toggle('selected', i === tab);
                c.querySelector('.card-label').classList.toggle('unselected', i !== tab);
            });
            document.getElementById('browseTitle').textContent = ['Ports', 'Queue', 'Settings'][tab];
            if (tab === 0) {
                showScreen('browse');
                document.getElementById('loading').classList.remove('hidden');
            }
        }
        
        function showScreen(screen) {
            document.getElementById('homeScreen').style.display = screen === 'home' ? 'flex' : 'none';
            document.getElementById('browseScreen').style.display = screen === 'browse' ? 'flex' : 'none';
            document.getElementById('detailsScreen').style.display = screen === 'details' ? 'block' : 'none';
            currentView = screen;
        }
        
        function openDetails(index) {
            selectedIndex = index;
            const game = games[index];
            document.getElementById('detailsTitle').textContent = game.name;
            
            let meta = '';
            if (game.genre) meta += game.genre + '  |  ';
            if (game.portedFrom) meta += game.portedFrom + '  |  ';
            if (game.region) meta += game.region + '  |  ';
            meta += formatSize(game.size);
            if (game.version) meta += '  |  v' + game.version;
            if (game.rating) meta += `  |  ${game.rating}/10`;
            if (game.publisher) meta += `  |  ${game.publisher}`;
            document.getElementById('detailsMeta').textContent = meta;
            
            document.getElementById('detailsDesc').textContent = game.description || 'Sem descrição disponível.';
            
            const notesEl = document.getElementById('detailsNotes');
            if (game.notes) {
                notesEl.innerHTML = '<strong>📝 Notas:</strong><br>' + game.notes;
                notesEl.style.display = 'block';
            } else {
                notesEl.style.display = 'none';
            }
            
            const poster = document.getElementById('detailsPoster');
            poster.src = game.iconUrl || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320"><rect fill="%231a1a2e" width="560" height="320"/></svg>';
            poster.onerror = () => { poster.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320"><rect fill="%231a1a2e" width="560" height="320"/></svg>'; };
            
            showScreen('details');
        }
        
        function closeDetails() {
            showScreen('browse');
            document.querySelectorAll('.cell').forEach((c, i) => {
                c.classList.toggle('selected', i === selectedIndex);
            });
        }
        
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (currentView === 'home') {
                if (e.key === 'ArrowLeft' && currentTab > 0) selectTab(currentTab - 1);
                if (e.key === 'ArrowRight' && currentTab < 2) selectTab(currentTab + 1);
                if (e.key === 'Enter') {
                    if (currentTab === 0) { showScreen('browse'); document.getElementById('loading').classList.remove('hidden'); }
                    else if (currentTab === 1) showToast('Queue screen');
                    else if (currentTab === 2) showToast('Settings screen');
                }
            } else if (currentView === 'browse') {
                const cols = 3;
                const total = games.length;
                if (e.key === 'ArrowUp') {
                    if (selectedIndex >= cols) selectedIndex -= cols;
                } else if (e.key === 'ArrowDown') {
                    if (selectedIndex + cols < total) selectedIndex += cols;
                } else if (e.key === 'ArrowLeft') {
                    if (selectedIndex % cols > 0) selectedIndex--;
                } else if (e.key === 'ArrowRight') {
                    if (selectedIndex % cols < cols - 1 && selectedIndex + 1 < total) selectedIndex++;
                } else if (e.key === 'Enter') {
                    openDetails(selectedIndex);
                    return;
                } else if (e.key === 'Escape' || e.key === 'Backspace') {
                    showScreen('home');
                    return;
                } else if (e.key === 'y' || e.key === 'Y') {
                    document.querySelectorAll('.cell').forEach(c => c.classList.toggle('list-view'));
                    return;
                } else if (e.key === 'l' || e.key === 'L') {
                    const totalPages = Math.ceil(games.length / GAMES_PER_PAGE);
                    if (currentPage < totalPages - 1) { currentPage++; renderGrid(); renderPagination(); }
                    return;
                } else if (e.key === 'r' || e.key === 'R') {
                    if (currentPage > 0) { currentPage--; renderGrid(); renderPagination(); }
                    return;
                }
                document.querySelectorAll('.cell').forEach((c, i) => c.classList.toggle('selected', i === selectedIndex));
            } else if (currentView === 'details') {
                if (e.key === 'Escape' || e.key === 'Backspace' || e.key === 'b' || e.key === 'B') {
                    closeDetails();
                } else if (e.key === 'Enter' || e.key === 'a' || e.key === 'A') {
                    showToast('Instalando: ' + games[selectedIndex].name + ' (simulação)');
                    closeDetails();
                }
            }
        });
        
        // Touch/mouse support for details install button
        document.getElementById('installBtn').addEventListener('click', () => {
            showToast('Instalando: ' + games[selectedIndex].name + ' (simulação)');
            closeDetails();
        });
        
        // Filter event listeners
        document.getElementById('filterGenre').addEventListener('change', applyFilters);
        document.getElementById('filterPlatform').addEventListener('change', applyFilters);
        document.getElementById('filterSort').addEventListener('change', applyFilters);
        document.getElementById('filterRegion').addEventListener('change', applyFilters);
        
        // Init - load games from index.json
        loadGames();
    </script>
</body>
</html>
