name: Build PortNX NRO

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install portlibs
        run: |
          dkp-pacman -Sy --noconfirm switch-dev switch-portlibs

      - name: Build Plutonium
        run: |
          cd lib/plutonium/Plutonium
          make -j$(nproc)

      - name: Build PortNX
        run: |
          cd ${{ github.workspace }}
          make -j$(nproc)

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortNX.nro
          path: PortNX.nro
          retention-days: 30

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: PortNX.nro
          generate_release_notes: true